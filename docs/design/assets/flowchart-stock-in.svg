<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1020" width="100%" height="100%" class="font-sans">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    .font-sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .node-title { font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .node-subtitle { font-size: 12px; font-weight: 400; fill: #334155; text-anchor: middle; }
    .edge-label { font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .edge-label-green { font-size: 11px; font-weight: 600; fill: #15803d; text-anchor: middle; }
    .edge-label-red { font-size: 11px; font-weight: 600; fill: #b91c1c; text-anchor: middle; }
    .line { stroke: #64748b; stroke-width: 1.75; fill: none; marker-end: url(#arrow); stroke-linejoin: round; }
    .line-red { stroke: #dc2626; stroke-width: 1.75; fill: none; marker-end: url(#arrow-red); stroke-linejoin: round; }
    .line-green { stroke: #16a34a; stroke-width: 1.75; fill: none; marker-end: url(#arrow-green); stroke-linejoin: round; }
    .lbl-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" />
  <rect x="1" y="1" width="758" height="1018" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12" />

  <!-- Title Badge -->
  <rect x="230" y="20" width="300" height="34" rx="17" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="380" y="42" class="node-title" style="fill:#3730a3; font-size:13px; letter-spacing:0.3px;">Flowchart: Transaksi Barang Masuk (Stock In)</text>

  <!-- 1. Start Node -->
  <rect x="260" y="75" width="240" height="42" rx="21" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="101" class="node-title" style="fill:#065f46;">Mulai: Input Barang Masuk</text>

  <!-- Line 1 -> 2 -->
  <path d="M 380 117 L 380 148" class="line"/>

  <!-- 2. Input Form -->
  <rect x="180" y="150" width="400" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="173" class="node-title">Pilih Tanggal, Supplier, &amp; Item Barang</text>
  <text x="380" y="191" class="node-subtitle">Pilih dari dropdown data supplier dan katalog barang</text>

  <!-- Line 2 -> 3 -->
  <path d="M 380 202 L 380 233" class="line"/>

  <!-- 3. Input Qty & Price -->
  <rect x="170" y="235" width="420" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="258" class="node-title">Masukkan Kuantitas Masuk &amp; Harga Beli Satuan (unit_price)</text>
  <text x="380" y="276" class="node-subtitle">Sertakan nomor faktur/nota supplier &amp; catatan tambahan</text>

  <!-- Line 3 -> 4 -->
  <path d="M 380 287 L 380 320" class="line"/>

  <!-- 4. Decision: Validasi -->
  <polygon points="380,322 550,377 380,432 210,377" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="371" class="node-title" style="fill:#92400e;">Validasi Form Input</text>
  <text x="380" y="389" class="node-subtitle" style="fill:#b45309; font-size:11px;">Qty &gt; 0 &amp; unit_price &gt;= 0?</text>

  <!-- Branch: Tidak Valid (To Right -> Error Box -> Loop Back) -->
  <path d="M 550 377 L 660 377 L 660 176 L 585 176" class="line-red"/>
  <rect x="562" y="365" width="70" height="22" class="lbl-bg"/>
  <text x="597" y="380" class="edge-label-red">Tidak Valid</text>

  <!-- Error Node on the right path -->
  <rect x="580" y="260" width="160" height="54" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="282" class="node-title" style="fill:#991b1b; font-size:11.5px;">Tampilkan Error</text>
  <text x="660" y="300" class="node-subtitle" style="fill:#b91c1c; font-size:10.5px;">Notifikasi input salah</text>

  <!-- Branch: Valid (Down) -->
  <path d="M 380 432 L 380 478" class="line-green"/>
  <rect x="350" y="442" width="60" height="20" class="lbl-bg"/>
  <text x="380" y="456" class="edge-label-green">Valid</text>

  <!-- 5. Calc Subtotal -->
  <rect x="180" y="480" width="400" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="503" class="node-title" style="fill:#1e40af;">Kalkulasi Nilai Finansial Otomatis</text>
  <text x="380" y="521" class="node-subtitle" style="fill:#1d4ed8;">subtotal = quantity × unit_price &amp; total_amount nota</text>

  <!-- Line 5 -> 6 -->
  <path d="M 380 532 L 380 563" class="line"/>

  <!-- 6. Begin Transaction -->
  <rect x="220" y="565" width="320" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="586" class="node-title" style="fill:#1e293b;">Mulai Database Transaction (DB::transaction)</text>
  <text x="380" y="602" class="node-subtitle" style="font-size:11px;">Menjamin atomisitas perubahan data stok &amp; finansial</text>

  <!-- Line 6 -> 7 -->
  <path d="M 380 611 L 380 640" class="line"/>

  <!-- 7. Save Header -->
  <rect x="170" y="642" width="420" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="664" class="node-title">1. Simpan Header Transaksi (stock_transactions)</text>
  <text x="380" y="681" class="node-subtitle">Nomor otomatis, type = 'IN', supplier_id, user_id, total_amount</text>

  <!-- Line 7 -> 8 -->
  <path d="M 380 692 L 380 721" class="line"/>

  <!-- 8. Save Details -->
  <rect x="170" y="723" width="420" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="745" class="node-title">2. Simpan Detail Transaksi (stock_transaction_details)</text>
  <text x="380" y="762" class="node-subtitle">item_id, quantity, unit_price snapshot, dan subtotal</text>

  <!-- Line 8 -> 9 -->
  <path d="M 380 773 L 380 802" class="line"/>

  <!-- 9. Increment Stock -->
  <rect x="170" y="804" width="420" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="826" class="node-title" style="fill:#065f46;">3. Tambah Stok Fisik pada Tabel items</text>
  <text x="380" y="843" class="node-subtitle" style="fill:#047857;">current_stock = current_stock + quantity</text>

  <!-- Line 9 -> 10 -->
  <path d="M 380 854 L 380 883" class="line"/>

  <!-- 10. Commit & Notify -->
  <rect x="180" y="885" width="400" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="907" class="node-title" style="fill:#166534;">Commit DB Transaction &amp; Flash Success Toast</text>
  <text x="380" y="924" class="node-subtitle" style="fill:#15803d;">Perbarui tabel riwayat transaksi &amp; redirect dengan Inertia</text>

  <!-- Line 10 -> 11 -->
  <path d="M 380 935 L 380 962" class="line"/>

  <!-- 11. End Node -->
  <rect x="290" y="964" width="180" height="40" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="989" class="node-title" style="fill:#ffffff;">Selesai</text>
</svg>