<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" width="100%" height="100%" class="font-sans">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    .font-sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .node-title { font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .node-subtitle { font-size: 12px; font-weight: 400; fill: #334155; text-anchor: middle; }
    .edge-label { font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .edge-label-green { font-size: 11px; font-weight: 600; fill: #15803d; text-anchor: middle; }
    .edge-label-red { font-size: 11px; font-weight: 600; fill: #b91c1c; text-anchor: middle; }
    .line { stroke: #64748b; stroke-width: 1.75; fill: none; marker-end: url(#arrow); stroke-linejoin: round; }
    .line-red { stroke: #dc2626; stroke-width: 1.75; fill: none; marker-end: url(#arrow-red); stroke-linejoin: round; }
    .line-green { stroke: #16a34a; stroke-width: 1.75; fill: none; marker-end: url(#arrow-green); stroke-linejoin: round; }
    .lbl-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" />
  <rect x="1" y="1" width="938" height="758" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12" />

  <!-- Title Badge -->
  <rect x="300" y="20" width="340" height="34" rx="17" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="470" y="42" class="node-title" style="fill:#92400e; font-size:13px; letter-spacing:0.3px;">Flowchart: Monitoring Stok &amp; Alert Stok Minimum</text>

  <!-- 1. Start Node -->
  <rect x="350" y="75" width="240" height="42" rx="21" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="101" class="node-title" style="fill:#065f46;">Pengguna Mengakses Dashboard</text>

  <!-- Line 1 -> 2 -->
  <path d="M 470 117 L 470 148" class="line"/>

  <!-- 2. Fetch Data -->
  <rect x="255" y="150" width="430" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="470" y="173" class="node-title">Query Data Seluruh Barang &amp; Hitung Valuasi</text>
  <text x="470" y="191" class="node-subtitle">Ambil items, category, current_stock, minimum_stock, purchase_price</text>

  <!-- Line 2 -> 3 -->
  <path d="M 470 202 L 470 238" class="line"/>

  <!-- 3. Decision Hub: Loop Item Evaluation -->
  <polygon points="470,240 640,295 470,350 300,295" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="290" class="node-title" style="fill:#0f172a;">Evaluasi Kondisi Tiap Barang</text>
  <text x="470" y="307" class="node-subtitle" style="fill:#334155; font-size:11.5px;">Bandingkan current_stock vs minimum_stock</text>

  <!-- Branch 1: Left -> current_stock == 0 -->
  <path d="M 300 295 L 160 295 L 160 388" class="line-red"/>
  <rect x="180" y="283" width="105" height="20" class="lbl-bg"/>
  <text x="232" y="297" class="edge-label-red">current_stock == 0</text>

  <!-- Card 1: Out of Stock -->
  <rect x="40" y="390" width="240" height="85" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="405" width="110" height="22" rx="11" fill="#dc2626"/>
  <text x="110" y="420" class="node-title" style="fill:#ffffff; font-size:10.5px; font-weight:700;">HABIS / KOSONG</text>
  <text x="160" y="445" class="node-title" style="fill:#991b1b; font-size:12px;">Prioritas Kritis (Badge Merah)</text>
  <text x="160" y="462" class="node-subtitle" style="fill:#b91c1c; font-size:10.5px;">Segera hubungi supplier!</text>

  <!-- Branch 2: Center -> 0 < stock <= minimum -->
  <path d="M 470 350 L 470 388" class="line"/>
  <rect x="400" y="358" width="140" height="20" class="lbl-bg"/>
  <text x="470" y="372" class="edge-label" style="fill:#d97706;">0 &lt; stok &lt;= minimum_stock</text>

  <!-- Card 2: Low Stock Warning -->
  <rect x="345" y="390" width="250" height="85" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
  <rect x="360" y="405" width="125" height="22" rx="11" fill="#ca8a04"/>
  <text x="422" y="420" class="node-title" style="fill:#ffffff; font-size:10.5px; font-weight:700;">MENIPIS / WARNING</text>
  <text x="470" y="445" class="node-title" style="fill:#854d0e; font-size:12px;">Peringatan Stok Menipis</text>
  <text x="470" y="462" class="node-subtitle" style="fill:#a16207; font-size:10.5px;">Siapkan pemesanan ulang (Reorder)</text>

  <!-- Branch 3: Right -> current_stock > minimum -->
  <path d="M 640 295 L 780 295 L 780 388" class="line-green"/>
  <rect x="660" y="283" width="105" height="20" class="lbl-bg"/>
  <text x="712" y="297" class="edge-label-green">stok &gt; minimum_stock</text>

  <!-- Card 3: Safe / Normal -->
  <rect x="660" y="390" width="240" height="85" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="675" y="405" width="105" height="22" rx="11" fill="#16a34a"/>
  <text x="727" y="420" class="node-title" style="fill:#ffffff; font-size:10.5px; font-weight:700;">AMAN / NORMAL</text>
  <text x="780" y="445" class="node-title" style="fill:#166534; font-size:12px;">Persediaan Aman (Badge Hijau)</text>
  <text x="780" y="462" class="node-subtitle" style="fill:#15803d; font-size:10.5px;">Stok memenuhi operasional rutin</text>

  <!-- Merge Lines from all 3 cards -->
  <path d="M 160 475 L 160 520 L 470 520" class="line" style="marker-end:none; stroke:#94a3b8;"/>
  <path d="M 780 475 L 780 520 L 470 520" class="line" style="marker-end:none; stroke:#94a3b8;"/>
  <path d="M 470 475 L 470 538" class="line"/>

  <!-- 4. Push Summary -->
  <rect x="220" y="540" width="500" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="470" y="562" class="node-title" style="fill:#1e40af;">Kompilasi Metrik Dashboard &amp; Total Valuasi Aset</text>
  <text x="470" y="580" class="node-subtitle" style="fill:#1d4ed8;">Rekap Total SKU, Jumlah Menipis, Habis, &amp; Total Nilai Stok Rp</text>

  <!-- Line 4 -> 5 -->
  <path d="M 470 592 L 470 622" class="line"/>

  <!-- 5. Render UI -->
  <rect x="200" y="624" width="540" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="470" y="646" class="node-title">Render Antarmuka React (Inertia Dashboard)</text>
  <text x="470" y="663" class="node-subtitle">Tampilkan kartu statistik metrik, tabel alert stok kritis, dan grafik stok</text>

  <!-- Line 5 -> End -->
  <path d="M 470 674 L 470 700" class="line"/>

  <!-- End Node -->
  <rect x="380" y="702" width="180" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="470" y="726" class="node-title" style="fill:#ffffff;">Selesai</text>
</svg>