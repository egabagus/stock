<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1230" width="100%" height="100%" class="font-sans">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    .font-sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .node-title { font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .node-subtitle { font-size: 12px; font-weight: 400; fill: #334155; text-anchor: middle; }
    .edge-label { font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .edge-label-green { font-size: 11px; font-weight: 600; fill: #15803d; text-anchor: middle; }
    .edge-label-red { font-size: 11px; font-weight: 600; fill: #b91c1c; text-anchor: middle; }
    .line { stroke: #64748b; stroke-width: 1.75; fill: none; marker-end: url(#arrow); stroke-linejoin: round; }
    .line-red { stroke: #dc2626; stroke-width: 1.75; fill: none; marker-end: url(#arrow-red); stroke-linejoin: round; }
    .line-green { stroke: #16a34a; stroke-width: 1.75; fill: none; marker-end: url(#arrow-green); stroke-linejoin: round; }
    .lbl-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" />
  <rect x="1" y="1" width="818" height="1228" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12" />

  <!-- Title Badge -->
  <rect x="260" y="20" width="300" height="34" rx="17" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
  <text x="410" y="42" class="node-title" style="fill:#991b1b; font-size:13px; letter-spacing:0.3px;">Flowchart: Transaksi Barang Keluar (Stock Out)</text>

  <!-- 1. Start Node -->
  <rect x="290" y="75" width="240" height="42" rx="21" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="101" class="node-title" style="fill:#065f46;">Mulai: Input Barang Keluar</text>

  <!-- Line 1 -> 2 -->
  <path d="M 410 117 L 410 148" class="line"/>

  <!-- 2. Input Form -->
  <rect x="210" y="150" width="400" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="173" class="node-title">Pilih Tanggal, Alasan Keluar, &amp; Barang</text>
  <text x="410" y="191" class="node-subtitle">Alasan: Penjualan, Pemakaian Sendiri, Rusak, atau Kedaluwarsa</text>

  <!-- Line 2 -> 3 -->
  <path d="M 410 202 L 410 233" class="line"/>

  <!-- 3. Input Qty & Price -->
  <rect x="185" y="235" width="450" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="258" class="node-title">Masukkan Kuantitas Keluar &amp; Nilai/Harga Satuan (unit_price)</text>
  <text x="410" y="276" class="node-subtitle">Pilihan harga jual jika penjualan, atau harga pokok jika rusak/pakai</text>

  <!-- Line 3 -> 4 -->
  <path d="M 410 287 L 410 320" class="line"/>

  <!-- 4. Decision: Format Validation -->
  <polygon points="410,322 580,377 410,432 240,377" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="371" class="node-title" style="fill:#92400e;">Validasi Format Data</text>
  <text x="410" y="389" class="node-subtitle" style="fill:#b45309; font-size:11px;">Qty &gt; 0 &amp; unit_price &gt;= 0?</text>

  <!-- Branch 4: Format Invalid (Right -> Loop back) -->
  <path d="M 580 377 L 720 377 L 720 176 L 615 176" class="line-red"/>
  <rect x="600" y="365" width="68" height="20" class="lbl-bg"/>
  <text x="634" y="379" class="edge-label-red">Tidak Valid</text>

  <!-- Branch 4: Valid (Down to Check Stock) -->
  <path d="M 410 432 L 410 473" class="line-green"/>
  <rect x="380" y="442" width="60" height="20" class="lbl-bg"/>
  <text x="410" y="456" class="edge-label-green">Valid</text>

  <!-- 5. Decision: Check Physical Stock -->
  <polygon points="410,475 600,535 410,595 220,535" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="528" class="node-title" style="fill:#991b1b;">Pengecekan Stok Fisik Aktual</text>
  <text x="410" y="547" class="node-subtitle" style="fill:#b91c1c; font-size:11.5px;">Apakah Qty Keluar &lt;= current_stock?</text>

  <!-- Branch 5: Stock Not Enough (Left -> Loop back to form) -->
  <path d="M 220 535 L 85 535 L 85 176 L 205 176" class="line-red"/>
  <rect x="105" y="523" width="90" height="22" class="lbl-bg"/>
  <text x="150" y="538" class="edge-label-red">Stok Kurang!</text>

  <rect x="25" y="330" width="165" height="54" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="107" y="352" class="node-title" style="fill:#991b1b; font-size:11px;">Peringatan Stok Kurang</text>
  <text x="107" y="370" class="node-subtitle" style="fill:#b91c1c; font-size:10px;">Stok tidak cukup</text>

  <!-- Branch 5: Stock Enough (Down) -->
  <path d="M 410 595 L 410 638" class="line-green"/>
  <rect x="375" y="606" width="70" height="20" class="lbl-bg"/>
  <text x="410" y="620" class="edge-label-green">Stok Cukup</text>

  <!-- 6. Calc Subtotal -->
  <rect x="210" y="640" width="400" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="662" class="node-title" style="fill:#1e40af;">Kalkulasi Nilai Finansial Barang Keluar</text>
  <text x="410" y="679" class="node-subtitle" style="fill:#1d4ed8;">subtotal = quantity × unit_price &amp; total_amount</text>

  <!-- Line 6 -> 7 -->
  <path d="M 410 690 L 410 718" class="line"/>

  <!-- 7. Begin DB Transaction & Concurrency Lock -->
  <rect x="190" y="720" width="440" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="742" class="node-title" style="fill:#1e293b;">DB Transaction &amp; Pessimistic Concurrency Lock</text>
  <text x="410" y="760" class="node-subtitle" style="font-size:11px;">Item::where('id', $id)-&gt;lockForUpdate() cegah race condition</text>

  <!-- Line 7 -> 8 -->
  <path d="M 410 772 L 410 800" class="line"/>

  <!-- 8. Save Header & Details -->
  <rect x="175" y="802" width="470" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="824" class="node-title">Simpan Header (OUT) &amp; Detail Transaksi Barang</text>
  <text x="410" y="842" class="node-subtitle">Catat user_id, type = 'OUT', total_amount, kuantitas, harga, &amp; subtotal</text>

  <!-- Line 8 -> 9 -->
  <path d="M 410 854 L 410 882" class="line"/>

  <!-- 9. Decrement Stock -->
  <rect x="180" y="884" width="460" height="50" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="906" class="node-title" style="fill:#991b1b;">Kurangi Stok Fisik pada Tabel items</text>
  <text x="410" y="923" class="node-subtitle" style="fill:#b91c1c;">current_stock = current_stock - quantity (Commit Transaction)</text>

  <!-- Line 9 -> 10 -->
  <path d="M 410 934 L 410 968" class="line"/>

  <!-- 10. Decision: Check Low Stock Warning -->
  <polygon points="410,970 595,1025 410,1080 225,1025" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="1020" class="node-title" style="fill:#854d0e;">Cek Ambang Batas Minimum</text>
  <text x="410" y="1038" class="node-subtitle" style="fill:#a16207; font-size:11px;">current_stock &lt;= minimum_stock?</text>

  <!-- Branch 10: Yes (Right -> Alert Badge -> Join) -->
  <path d="M 595 1025 L 700 1025 L 700 1105 L 590 1105" class="line-red"/>
  <rect x="615" y="1013" width="60" height="20" class="lbl-bg"/>
  <text x="645" y="1027" class="edge-label-red">Ya (Kritis)</text>

  <rect x="630" y="1045" width="150" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="705" y="1065" class="node-title" style="fill:#991b1b; font-size:11px;">Trigger Low Stock</text>
  <text x="705" y="1079" class="node-subtitle" style="fill:#b91c1c; font-size:10px;">Tandai di dashboard</text>

  <!-- Branch 10: No (Direct Down) -->
  <path d="M 410 1080 L 410 1118" class="line-green"/>
  <rect x="365" y="1088" width="90" height="20" class="lbl-bg"/>
  <text x="410" y="1102" class="edge-label-green">Tidak (Aman)</text>

  <!-- 11. Finish Success -->
  <rect x="230" y="1120" width="360" height="44" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="1141" class="node-title" style="fill:#166534;">Tampilkan Flash Notifikasi Berhasil &amp; Redirect</text>
  <text x="410" y="1155" class="node-subtitle" style="fill:#15803d; font-size:11px;">Riwayat mutasi &amp; stok baru siap ditampilkan</text>

  <!-- Line 11 -> End -->
  <path d="M 410 1164 L 410 1188" class="line"/>

  <!-- End Node -->
  <rect x="320" y="1190" width="180" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="1213" class="node-title" style="fill:#ffffff;">Selesai</text>
</svg>