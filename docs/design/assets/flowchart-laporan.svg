<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 840" width="100%" height="100%" class="font-sans">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    .font-sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .node-title { font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .node-subtitle { font-size: 12px; font-weight: 400; fill: #334155; text-anchor: middle; }
    .edge-label { font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .edge-label-green { font-size: 11px; font-weight: 600; fill: #15803d; text-anchor: middle; }
    .edge-label-red { font-size: 11px; font-weight: 600; fill: #b91c1c; text-anchor: middle; }
    .line { stroke: #64748b; stroke-width: 1.75; fill: none; marker-end: url(#arrow); stroke-linejoin: round; }
    .line-red { stroke: #dc2626; stroke-width: 1.75; fill: none; marker-end: url(#arrow-red); stroke-linejoin: round; }
    .line-green { stroke: #16a34a; stroke-width: 1.75; fill: none; marker-end: url(#arrow-green); stroke-linejoin: round; }
    .lbl-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" />
  <rect x="1" y="1" width="858" height="838" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12" />

  <!-- Title Badge -->
  <rect x="260" y="20" width="340" height="34" rx="17" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="430" y="42" class="node-title" style="fill:#3730a3; font-size:13px; letter-spacing:0.3px;">Flowchart: Pembuatan &amp; Ekspor Laporan Persediaan</text>

  <!-- 1. Start Node -->
  <rect x="310" y="75" width="240" height="42" rx="21" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="101" class="node-title" style="fill:#065f46;">Mulai: Buka Menu Laporan</text>

  <!-- Line 1 -> 2 -->
  <path d="M 430 117 L 430 148" class="line"/>

  <!-- 2. Select Filter -->
  <rect x="200" y="150" width="460" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="173" class="node-title">Tentukan Kriteria Filter Laporan</text>
  <text x="430" y="191" class="node-subtitle">Pilih rentang tanggal (dari - sampai), jenis transaksi (IN / OUT), &amp; kategori</text>

  <!-- Line 2 -> 3 -->
  <path d="M 430 202 L 430 232" class="line"/>

  <!-- 3. Query DB -->
  <rect x="180" y="234" width="500" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="256" class="node-title" style="fill:#0f172a;">Query Data Mutasi &amp; Nilai Finansial PostgreSQL</text>
  <text x="430" y="274" class="node-subtitle" style="fill:#334155;">Filter stock_transactions JOIN details, items, suppliers, &amp; categories</text>

  <!-- Line 3 -> 4 -->
  <path d="M 430 286 L 430 316" class="line"/>

  <!-- 4. Calc Summary -->
  <rect x="150" y="318" width="560" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="340" class="node-title" style="fill:#1e40af;">Kalkulasi Ringkasan Kuantitas &amp; Nilai Uang Transaksi</text>
  <text x="430" y="358" class="node-subtitle" style="fill:#1d4ed8;">Total Qty Masuk &amp; Keluar, Mutasi Bersih, Total Belanja Beli &amp; Nilai Barang Keluar</text>

  <!-- Line 4 -> 5 -->
  <path d="M 430 372 L 430 402" class="line"/>

  <!-- 5. Render Preview -->
  <rect x="180" y="404" width="500" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="426" class="node-title">Tampilkan Preview Tabel Laporan di Layar</text>
  <text x="430" y="443" class="node-subtitle">Ringkasan KPI keuangan di atas tabel, rincian pergerakan di tabel dinamis</text>

  <!-- Line 5 -> 6 -->
  <path d="M 430 454 L 430 493" class="line"/>

  <!-- 6. Decision: User Action -->
  <polygon points="430,495 590,550 430,605 270,550" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="545" class="node-title" style="fill:#92400e;">Pilih Tindakan Pengguna</text>
  <text x="430" y="562" class="node-subtitle" style="fill:#b45309; font-size:11.5px;">Aksi lanjutan laporan?</text>

  <!-- Branch Left: Cetak / Print View -->
  <path d="M 270 550 L 140 550 L 140 648" class="line"/>
  <rect x="155" y="538" width="90" height="20" class="lbl-bg"/>
  <text x="200" y="552" class="edge-label">Cetak / Print</text>

  <rect x="40" y="650" width="200" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="674" class="node-title" style="fill:#166534; font-size:12.5px;">Print-Friendly View</text>
  <text x="140" y="692" class="node-subtitle" style="fill:#15803d; font-size:11px;">Buka dialog cetak browser</text>

  <!-- Branch Center: Ekspor CSV / Excel -->
  <path d="M 430 605 L 430 648" class="line"/>
  <rect x="375" y="615" width="110" height="20" class="lbl-bg"/>
  <text x="430" y="629" class="edge-label">Ekspor CSV</text>

  <rect x="330" y="650" width="200" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="674" class="node-title" style="fill:#166534; font-size:12.5px;">Download File CSV</text>
  <text x="430" y="692" class="node-subtitle" style="fill:#15803d; font-size:11px;">Simpan format spreadsheet</text>

  <!-- Branch Right: Selesai Melihat -->
  <path d="M 590 550 L 720 550 L 720 748 L 530 748" class="line" style="marker-end:none;"/>
  <rect x="615" y="538" width="90" height="20" class="lbl-bg"/>
  <text x="660" y="552" class="edge-label">Selesai Melihat</text>

  <!-- Merge paths from actions to End -->
  <path d="M 140 706 L 140 748 L 330 748" class="line" style="marker-end:none; stroke:#94a3b8;"/>
  <path d="M 430 706 L 430 748" class="line" style="stroke:#94a3b8;"/>

  <!-- End Node -->
  <rect x="340" y="768" width="180" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="792" class="node-title" style="fill:#ffffff;">Selesai</text>
</svg>